<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Engine audio checks</title>
<style>body { background:#15181d; color:#f3f4f6; font:14px system-ui; } pre { white-space:pre-wrap; } iframe { width:100%; height:900px; border:0; }</style>
<pre id="result">Running…</pre>
<iframe id="settings" title="Engine sound settings"></iframe>
<script src="../src/game.js"></script>
<script>
// Serve the project root, then open /test/engine-audio-test.html. Real offline Web Audio; UI uses a fake renderer and no hardware.
(async () => {
  const check = (ok, message) => { if (!ok) throw Error(message); }, lines = [];
  const { EngineAudio, ENGINE_ERAS, CAR } = ApexGP, rate = 48000;
  const state = id => ({ setup:{engineEra:id}, gear:5, rpm:12000, thr:1, brk:0, shiftT:0, ers:1, speed:0, overtake:false, surf:['asphalt','asphalt','asphalt','asphalt'], slipMax:0, alpha:[0,0,0,0], lock:[0,0,0,0], spin:[0,0,0,0], Fz:[1900,1900,2250,2250], impact:0 });
  const stats = (buffer, start = 0.2, end = 0.6) => {
    const d = buffer.getChannelData(0); let energy = 0, diff = 0, peak = 0, n = 0;
    for (let i = Math.ceil(start * rate); i < Math.min(d.length, end * rate); i++) {
      check(Number.isFinite(d[i]), 'non-finite audio sample'); peak = Math.max(peak, Math.abs(d[i]));
      energy += d[i] ** 2; diff += (d[i] - d[i - 1]) ** 2; n++;
    }
    return { rms:Math.sqrt(energy / n), peak, brightness:Math.sqrt(diff / (energy || 1)) };
  };
  const render = async (id, options = {}) => {
    const ac = new OfflineAudioContext(2, rate * 0.65, rate), audio = new EngineAudio(), sim = Object.assign(state(id), options.sim);
    audio.init(ac); audio.muted = !!options.muted;
    if (options.volume !== undefined) audio.volume = options.volume;
    if (options.synthOnly) audio.v12Loading = Promise.resolve(false);
    else if (id === 'v12') check(await audio.loadV12(), 'V12 recording did not load');
    audio.update(sim, options.on !== false, options.near ? (Array.isArray(options.near) ? options.near : [options.near]) : null, !!options.inside, options.dist || 0);
    if (options.recordedOnly) { audio.synthG.gain.cancelScheduledValues(0); audio.synthG.gain.setValueAtTime(0, 0); }
    const buffer = await ac.startRendering();
    return { audio, sim, buffer, ...stats(buffer) };
  };
  const expected = (era, rpm) => (era.idle + Math.max(0, Math.min(1.08, (rpm - CAR.idle) / (CAR.limiter - CAR.idle))) * (era.redline - era.idle)) / 60 * era.cylinders / 2;
  const signatures = [];
  for (const era of ENGINE_ERAS) {
    const out = await render(era.id), idle = await render(era.id, {sim:{rpm:CAR.idle,thr:0.08}}), helmet = await render(era.id, {inside:true});
    check(out.rms > 0.02 && out.peak < 0.95, era.id + ': silent or clipped');
    check(idle.rms < out.rms * 0.8 && idle.rms > 0.001, era.id + ': throttle dynamics missing');
    check(helmet.brightness < out.brightness, era.id + ': helmet should soften the exhaust');
    const hz = out.audio.oscs[0][0].frequency.value;
    check(Math.abs(hz - expected(era, out.sim.rpm)) < 1, era.id + ': incorrect audible firing order/rev range');
    const boost = await render(era.id, {sim:{speed:60,overtake:true}});
    check((boost.audio.tg.gain.value > 0.001) === era.turbo, era.id + ': turbo on the wrong era');
    check((boost.audio.ersG.gain.value > 0.001) === era.turbo, era.id + ': electric whine on the wrong era');
    const rival = await render(era.id, {near:{rpm:11000,dist:8,closing:40,pan:0.8}});
    check(Math.abs(rival.audio.oppO[0][0].frequency.value - expected(era, 11000) * (1 + 40 / 343)) < 1, era.id + ': rival era/doppler');
    check(rival.audio.oppPan.pan.value > 0.7, 'rival stereo position');
    const d = out.buffer.getChannelData(0); signatures.push({id:era.id, data:d.slice(rate * 0.3, rate * 0.4)});
    lines.push(era.label + ': ' + hz.toFixed(0) + ' Hz firing order; RMS ' + out.rms.toFixed(3) + ', peak ' + out.peak.toFixed(3));
  }
  for (let i = 0; i < signatures.length; i++) for (let j = i + 1; j < signatures.length; j++) {
    let diff = 0; signatures[i].data.forEach((v, k) => { diff += (v - signatures[j].data[k]) ** 2; });
    check(Math.sqrt(diff / signatures[i].data.length) > 0.03, 'era waveforms must differ');
  }
  check((await render('v10', {muted:true})).peak < 1e-6, 'mute must silence all audio');
  check((await render('v10', {on:false})).peak < 1e-6, 'inactive session must be silent');
  check((await render('bad-saved-era')).audio.era.id === 'v6', 'invalid era fallback');

  // Prove the recording is audible and follows RPM, rather than repeating a pass-by.
  const hzPower = (d, start, n, hz) => {
    const k = 2 * Math.cos(2 * Math.PI * hz / rate); let a = 0, b = 0;
    for (let i = 0; i < n; i++) { const v = d[start + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1))) + k * a - b; b = a; a = v; }
    return a * a + b * b - k * a * b;
  };
  const dominantHz = (d, start, n, lo, hi, step = 2) => {
    let best = 0, bestHz = 0;
    for (let hz = lo; hz <= hi; hz += step) { const power = hzPower(d, start, n, hz); if (power > best) { best = power; bestHz = hz; } }
    return bestHz;
  };
  const dominantBank = (buffer, expected) => dominantHz(buffer.getChannelData(0), rate * 0.3, 4096, expected * 0.85, expected * 1.15);
  for (const rpm of [9500, 11000, CAR.limiter]) {
    const out = await render('v12', {sim:{rpm},recordedOnly:true});
    const hz = expected(ENGINE_ERAS.find(e => e.id === 'v12'), rpm) / 2;
    const measured = dominantBank(out.buffer, hz);
    check(out.rms > 0.025 && out.peak < 0.95, 'V12 recording itself must be audible and unclipped');
    check(Math.abs(measured / hz - 1) < 0.045, 'V12 recorded pitch does not follow RPM: ' + measured + ' vs ' + hz);
    lines.push('V12 recording only: ' + rpm + ' drivetrain RPM, measured bank ' + measured.toFixed(0) + ' Hz, RMS ' + out.rms.toFixed(3));
  }
  for (const sim of [{rpm:CAR.idle,thr:1}, {rpm:12000,thr:0}]) {
    const out = await render('v12', {sim,recordedOnly:true});
    check(out.peak < 1e-6, 'unrecorded idle/coasting must not replay loaded samples');
  }
  check((await render('v12', {muted:true})).peak < 1e-6, 'mute must silence recorded audio');
  check((await render('v12', {on:false})).peak < 1e-6, 'inactive recording must be silent');
  check((await render('v12', {sim:{shiftT:0.045}})).rms < (await render('v12')).rms * 0.3, 'gear cut must duck the recording');

  // Rate window: pitch-shifting drags the recorded formants, so each loop only plays where its
  // demanded rate is mild (full level 0.88–1.12, smoothstep fade to silence at the 0.85/1.15 clamp).
  // Synthesis covers exactly what the fades give up — silent at full blend, back for over-rev —
  // and the helmet lowpass no longer dulls the recording when it is loudest.
  const v12 = ENGINE_ERAS.find(e => e.id === 'v12');
  const soundRpmOf = rpm => v12.idle + Math.max(0, Math.min(1.08, (rpm - CAR.idle) / (CAR.limiter - CAR.idle))) * (v12.redline - v12.idle);
  const fadeOf = rate => { const e = Math.max(0, Math.min(1, Math.min(rate - 0.85, 1.15 - rate) / 0.03)); return e * e * (3 - 2 * e); };
  const windowSweep = [];
  for (const rpm of [CAR.idle, 8500, 9500, 11000, CAR.limiter, 13500]) {
    const out = await render('v12', {sim:{rpm}}), sr = soundRpmOf(rpm);
    const rec = Math.max(0, Math.min(1, (sr - 8500) / 2000)), blend = Math.max(0, Math.min(1, (sr - 11000) / 3000));
    let cover = 0;
    out.audio.v12Loops.forEach((loop, i) => {
      const demand = sr / loop.rpm, fade = fadeOf(demand);
      cover = Math.max(cover, fade);
      const rate = loop.source.playbackRate.value;
      check(rate >= 0.85 - 1e-6 && rate <= 1.15 + 1e-6, 'V12 playbackRate must stay inside 0.85–1.15 at ' + rpm + ': ' + rate);
      check(Math.abs(rate - Math.max(0.85, Math.min(1.15, demand))) < 1e-6, 'V12 playbackRate must follow the clamped demand at ' + rpm);
      check(Math.abs(loop.gain.gain.value - 2.8 * rec * fade * Math.sqrt(i ? blend : 1 - blend)) < 1e-3, 'V12 loop gain must fade with the rate window at ' + rpm);
    });
    check(Math.abs(out.audio.synthG.gain.value - (1 - rec * cover)) < 1e-3, 'synth must cover exactly what the loops fade out at ' + rpm);
    windowSweep.push({ rpm, synth: out.audio.synthG.gain.value, loops: out.audio.v12Loops.map(l => l.gain.gain.value) });
  }
  const partBlend = windowSweep[1], fullBlend = windowSweep[4], overRev = windowSweep[5];
  check(fullBlend.synth < 1e-3 && fullBlend.loops[1] > 2, 'full blend must silence the synth under the recording');
  check(overRev.loops.every(g => g < 1e-3) && overRev.synth > 0.99, 'over-rev past both windows must hand back to synthesis');
  check(partBlend.synth > 0.4, 'partial blend must keep synth for a smooth transition');
  // A downshift blip inside the window still lifts the loop rate 7% (rendered so the rate settles).
  const blipCtx = new OfflineAudioContext(2, rate * 0.65, rate), blipA = new EngineAudio(), blipSim = state('v12');
  blipA.init(blipCtx); check(await blipA.loadV12(), 'blip V12 load'); blipSim.rpm = 11000;
  blipA.update(blipSim, true, null, false); blipSim.gear = 4; blipA.update(blipSim, true, null, false);
  await blipCtx.startRendering();
  check(blipA.blipT > 0 && Math.abs(blipA.v12Loops[1].source.playbackRate.value - soundRpmOf(11000) / 14000 * 1.07) < 1e-3, 'downshift blip must lift the in-window loop rate 7%');
  const helmLo = await render('v12', {sim:{rpm:9000}, inside:true}), outLo = await render('v12', {sim:{rpm:9000}});
  const helmHi = await render('v12', {sim:{rpm:CAR.limiter}, inside:true}), outHi = await render('v12', {sim:{rpm:CAR.limiter}});
  check(Math.abs(helmLo.audio.lp.frequency.value / outLo.audio.lp.frequency.value - 0.4) < 1e-3, 'helmet factor must be the v12 constant at partial recording');
  check(Math.abs(helmHi.audio.lp.frequency.value / outHi.audio.lp.frequency.value - 0.4) < 1e-3, 'helmet factor must not depend on the recording level');
  check(helmHi.brightness < outHi.brightness, 'helmet must still soften the exhaust at full blend');
  const manifest = await (await fetch('../assets/audio/runtime.json')).json();
  const oldDuration = [0.2327, 0.1829]; // pre-regeneration mid/high loop lengths
  outHi.audio.v12Loops.forEach((loop, i) => {
    check(loop.source.buffer.duration > oldDuration[i], 'V12 loop ' + i + ' must be longer than the old ' + oldDuration[i] + ' s: ' + loop.source.buffer.duration);
    check(Math.abs(loop.source.buffer.duration - manifest.loops[i].durationSeconds) < 1e-6, 'decoded loop duration must match the manifest');
  });
  lines.push('PASS: V12 seams — rate window 0.85–1.15 with smoothstep fade over sweep ' + windowSweep.map(s => s.rpm).join('/') + ' rpm; synth ' + fullBlend.synth.toFixed(3) + ' at full blend, ' + overRev.synth.toFixed(3) + ' on over-rev, ' + partBlend.synth.toFixed(3) + ' at partial; helmet factor constant 0.4 (recording-independent), brightness ' + helmHi.brightness.toFixed(3) + ' < ' + outHi.brightness.toFixed(3) + '; loops ' + outHi.audio.v12Loops.map(l => l.source.buffer.duration.toFixed(3) + ' s').join('/') + ' match manifest.');

  // A missing file, corrupt decode or network error keeps a playable synth and never retries every frame.
  const realFetch = window.fetch;
  for (const failure of ['http','decode','network']) {
    const context = new OfflineAudioContext(2, rate * 0.65, rate), fallback = new EngineAudio();
    fallback.init(context); let calls = 0;
    try {
      window.fetch = async () => { calls++; if (failure === 'network') throw TypeError('test network failure'); return new Response('invalid WAV', {status:failure === 'http' ? 404 : 200}); };
      fallback.update(state('v12'), true, null, false);
      check(await fallback.v12Loading === false && !fallback.v12Loops, 'failed sample must retain synthesis');
      fallback.update(state('v12'), true, null, false);
      check(calls === 2, 'failed sample load retried every frame');
      check(stats(await context.startRendering()).rms > 0.02, 'fallback must remain audible');
    } finally { window.fetch = realFetch; }
  }
  const lateContext = new OfflineAudioContext(2, rate * 0.65, rate), late = new EngineAudio(), releases = [];
  late.init(lateContext);
  try {
    window.fetch = (...args) => new Promise(resolve => releases.push(() => resolve(realFetch(...args))));
    late.update(state('v12'), true, null, false);
    check(!late.v12Loops && late.synthG.gain.value === 1, 'loading must not block or mute the synth');
    releases.forEach(release => release());
    check(await late.v12Loading, 'delayed sample load failed');
    check(late.v12Loops.every(loop => loop.gain.gain.value === 0), 'late samples must start silent');
    late.update(state('v12'), true, null, false);
    check(stats(await lateContext.startRendering()).rms > 0.025, 'delayed samples did not blend in');
  } finally { window.fetch = realFetch; }
  const closedContext = new AudioContext(), closed = new EngineAudio(), closeReleases = [];
  closed.init(closedContext);
  try {
    window.fetch = (...args) => new Promise(resolve => closeReleases.push(() => resolve(realFetch(...args))));
    const loading = closed.loadV12();
    await closedContext.close(); closeReleases.forEach(release => release());
    check(await loading === false && !closed.v12Loops, 'destroyed audio must not create late sources');
  } finally { window.fetch = realFetch; }
  lines.push('PASS: V12 recorded pitch/levels, synthetic idle/coast, mute/pause, delayed loading and HTTP/decode/network fallback.');

  // Exercise shifts, limiter, impacts, surface effects, pause/resume and era changes on one running graph.
  const ac = new OfflineAudioContext(2, rate * 2.2, rate), audio = new EngineAudio(), sim = state('v12');
  const transientNears = [{ rpm: 11000, dist: 9, closing: 12, pan: 0.3 }, { rpm: 9500, dist: 22, closing: -6, pan: -0.5 }];
  audio.init(ac); check(await audio.loadV12(), 'transient V12 load'); audio.update(sim, true, null, false);
  const steps = [0.2,0.3,0.5,0.65,0.85,1.05,1.25,1.5,1.8].map(t => ac.suspend(t));
  const rendering = ac.startRendering();
  for (let i = 0; i < steps.length; i++) {
    await steps[i];
    if (i === 0) { sim.gear = 6; sim.shiftT = 0.045; }
    if (i === 1) { sim.shiftT = 0; sim.rpm = 8500; }
    if (i === 2) { sim.gear = 4; sim.thr = 0; sim.brk = 0.9; sim.rpm = 11000; }
    if (i === 3) { sim.rpm = CAR.limiter; sim.thr = 1; sim.brk = 0; }
    if (i === 4) { sim.impact = 12; sim.speed = 70; sim.surf = ['kerb','gravel']; sim.slipMax = 1.5; }
    if (i === 6) { sim.setup.engineEra = 'v10'; sim.impact = 0; sim.gear = 1; }
    if (i === 7) audio.muted = true;
    if (i === 8) { audio.muted = false; sim.setup.engineEra = 'v12'; }
    audio.update(sim, i !== 5, i >= 6 ? transientNears : null, false);
    if (i === 2) check(audio.blipT > ac.currentTime, 'downshift throttle blip missing');
    if (i === 6) check(audio.blipT === 0 && audio.era.id === 'v10', 'resume must not invent a downshift');
    if (i === 7) check(audio.v12Loops.every(loop => loop.gain.gain.value < 0.06), 'samples did not fade out after changing era');
    await ac.resume();
  }
  const transient = stats(await rendering, 0, 2.2);
  check(transient.peak < 0.95 && transient.rms > 0.01, 'transient output clipped or silent');
  const v12era = ENGINE_ERAS.find(e => e.id === 'v12');
  for (let i = 0; i < transientNears.length; i++) check(Math.abs(audio.opps[i].oscs[0][0].frequency.value - expected(v12era, transientNears[i].rpm) * (1 + transientNears[i].closing / 343)) < 1, 'era change must retune every rival voice');
  check((await render('v12', {synthOnly:true})).rms > 0.02, 'V12 synthesis fallback');
  lines.push('PASS: all four real Web Audio renders, throttle/helmet dynamics, rival doppler/pan, turbo/ERS gating, shifts, limiter, surfaces, mute and pause.');

  // Rev limiter: the cut must be an audio-rate buzz locked to the firing order, not a fixed frame flutter.
  // The rate is f/3: the synth is periodic at f/2, so its envelope can only contain multiples of f/2 —
  // energy at f/3 can only come from the gate. Rectify + a one-firing-period moving average nulls the
  // firing ripple and keeps the slower cut ripple.
  const cutEnvelope = (buffer, f) => {
    const d = buffer.getChannelData(0), L = Math.max(1, Math.round(rate / f)), env = new Float32Array(d.length);
    let sum = 0;
    for (let i = 0; i < d.length; i++) { sum += Math.abs(d[i]); if (i >= L) sum -= Math.abs(d[i - L]); env[i] = sum / Math.min(i + 1, L); }
    return env;
  };
  const cutStart = rate * 0.25, cutN = rate * 0.3, cutRates = {};
  for (const era of ENGINE_ERAS) {
    const f = expected(era, CAR.limiter), r = f / 3;
    const out = await render(era.id, {sim:{rpm:CAR.limiter}, synthOnly:true});
    const env = cutEnvelope(out.buffer, f);
    const measured = dominantHz(env, cutStart, cutN, f * 0.25, f * 0.45, 1);
    check(Math.abs(measured / r - 1) < 0.03, era.id + ': limiter buzz not locked to the firing order: ' + measured + ' vs ' + r.toFixed(1) + ' Hz');
    let lo = Infinity, hi = 0, mean = 0;
    for (let i = cutStart; i < cutStart + cutN; i++) { lo = Math.min(lo, env[i]); hi = Math.max(hi, env[i]); mean += env[i]; }
    mean /= cutN;
    check((hi - lo) / mean > 0.25, era.id + ': limiter cut must audibly gate the engine');
    const cutPower = hzPower(env, cutStart, cutN, r);
    check(hzPower(env, cutStart, cutN, 19) < cutPower * 0.05, era.id + ': fixed 19 Hz flutter must be gone');
    cutRates[era.id] = { measured, cutPower };
    lines.push(era.id + ' limiter: firing ' + f.toFixed(0) + ' Hz, cut buzz ' + measured.toFixed(0) + ' Hz (f/3 = ' + r.toFixed(0) + '), envelope swing ' + ((hi - lo) / mean).toFixed(2));
  }
  check(cutRates.v10.measured > cutRates.v6.measured * 1.5, 'cut rate must scale with the era firing order');
  const v10 = ENGINE_ERAS.find(e => e.id === 'v10'), fOver = expected(v10, 13500);
  const over = await render('v10', {sim:{rpm:13500}, synthOnly:true});
  const overHz = dominantHz(cutEnvelope(over.buffer, fOver), cutStart, cutN, fOver * 0.25, fOver * 0.45, 1);
  check(Math.abs(overHz / (fOver / 3) - 1) < 0.03 && overHz > cutRates.v10.measured * 1.03, 'cut rate must keep following rpm past the limiter');
  const fBelow = expected(v10, 12000), below = await render('v10', {synthOnly:true});
  check(hzPower(cutEnvelope(below.buffer, fBelow), cutStart, cutN, fBelow / 3) < cutRates.v10.cutPower * 0.05, 'no ignition-cut modulation below the limiter');
  lines.push('PASS: limiter buzz at f/3 in every era, ' + overHz.toFixed(0) + ' Hz at 13,500 rpm vs ' + cutRates.v10.measured.toFixed(0) + ' Hz on the limiter; no cut below it, no 19 Hz flutter.');

  // Rain: a bright bed plus speed-scaled spray in wet sessions, softer in the helmet, silent when dry/muted/paused.
  const wetSim = extra => Object.assign({setup:{engineEra:'v6',wet:true}}, extra);
  const dry = await render('v6', {sim:{speed:55}}), wet = await render('v6', {sim:wetSim({speed:55})});
  const dryIn = await render('v6', {sim:{speed:55}, inside:true}), wetIn = await render('v6', {sim:wetSim({speed:55}), inside:true});
  check(dry.audio.rain.gain.value === 0 && dry.audio.spray.gain.value === 0, 'dry sessions must keep rain voices silent');
  check(wet.rms > dry.rms && wet.brightness > dry.brightness * 1.1, 'wet render must add audible high-frequency rain');
  // Isolate the rain contribution: whole-mix RMS cannot (the engine dominates).
  const hf = r => (r.brightness * r.rms) ** 2;
  check(hf(wet) - hf(dry) > (hf(wetIn) - hf(dryIn)) * 1.5, 'rain must be softer inside the cockpit');
  check(wetIn.audio.rain.gain.value < wet.audio.rain.gain.value && wetIn.audio.spray.gain.value < wet.audio.spray.gain.value, 'helmet must attenuate the rain voices');
  check((await render('v6', {sim:wetSim({speed:0})})).audio.spray.gain.value === 0, 'spray must wait for road speed');
  check((await render('v6', {sim:wetSim({speed:60})})).audio.spray.gain.value > 0.05, 'spray must scale with speed');
  check((await render('v6', {muted:true, sim:wetSim({speed:60})})).peak < 1e-6, 'mute must silence rain');
  check((await render('v6', {on:false, sim:wetSim({speed:60})})).peak < 1e-6, 'inactive session must silence rain');
  lines.push('PASS: rain bed/spray — brightness wet ' + wet.brightness.toFixed(3) + ' vs dry ' + dry.brightness.toFixed(3) + '; rain HF energy outside/inside ' + ((hf(wet) - hf(dry)) / (hf(wetIn) - hf(dryIn))).toFixed(1) + 'x; speed fade-in, dry silence, mute and pause.');

  // Trackside ambience: the chase camera (7.4 m back) gets a stronger send plus distance level/air-absorption
  // treatment; cockpit stays exactly onboard. Bus audibility is proven from rendered buffers, not just params.
  const chase = await render('v10', {dist:7.4, synthOnly:true}), board = await render('v10', {synthOnly:true});
  const pit = await render('v10', {inside:true, synthOnly:true}), pitFar = await render('v10', {inside:true, dist:7.4, synthOnly:true});
  check(chase.audio.send.gain.value > board.audio.send.gain.value * 3, 'ambience send must scale with camera distance');
  const mid = await render('v10', {dist:3.7, synthOnly:true});
  check(mid.audio.send.gain.value > pit.audio.send.gain.value && mid.audio.send.gain.value < chase.audio.send.gain.value, 'ambience send must follow distance continuously');
  check(pit.audio.send.gain.value < 0.05, 'cockpit ambience send must be near zero');
  check(chase.audio.eg.gain.value < board.audio.eg.gain.value * 0.85 && chase.rms < board.rms * 0.9, 'chase engine must be quieter than onboard');
  check(chase.audio.lp.frequency.value < board.audio.lp.frequency.value * 0.8 && chase.brightness < board.brightness, 'chase engine must be duller than onboard (air absorption)');
  check(Math.abs(pitFar.audio.lp.frequency.value - pit.audio.lp.frequency.value) < 1 && Math.abs(pitFar.audio.eg.gain.value - pit.audio.eg.gain.value) < 1e-4, 'helmet treatment must ignore camera distance');
  // Buffer proof: render the raw send bus in isolation — dry paths dropped, convolver bypassed — so the
  // random IR can neither colour nor interfere with the measurement (same pattern as rivalSend below).
  const sendBus = async (inside, dist) => {
    const ctx = new OfflineAudioContext(2, rate * 0.65, rate), a = new EngineAudio();
    a.init(ctx); a.update(state('v10'), true, null, inside, dist);
    a.gate.disconnect(a.master); // player dry path; the send taps the gate, so the bus feed stays alive
    for (const v of a.opps) (v.pan || v.g).disconnect(a.master);
    for (const s of a.squeals) (s.pan || s.g).disconnect(a.master);

  lines.push('PASS: trackside ambience — send chase ' + chase.audio.send.gain.value.toFixed(2) + ' / mid ' + mid.audio.send.gain.value.toFixed(2) + ' / cockpit ' + pit.audio.send.gain.value.toFixed(2) + '; isolated bus RMS chase ' + chaseBus.rms.toFixed(4) + ' vs cockpit ' + pitBus.rms.toFixed(4) + ' (' + (chaseBus.rms / pitBus.rms).toFixed(1) + 'x); chase RMS ' + chase.rms.toFixed(3) + ' vs onboard ' + board.rms.toFixed(3) + ', brightness ' + chase.brightness.toFixed(3) + ' vs ' + board.brightness.toFixed(3) + '; mute/pause silent.');

  // Rival pack: the 3 nearest AI cars each get a voice. Voice 0 keeps the original names and level,
  // voices 1–2 are trimmed; every voice follows the selected era and taps the trackside send.
  const v10era = ENGINE_ERAS.find(e => e.id === 'v10'), v6era = ENGINE_ERAS.find(e => e.id === 'v6');
  const trio = [
    { rpm: 12000, dist: 6, closing: 25, pan: -0.7 },

    check(Math.abs(v.oscs[0][0].frequency.value - fo) < 1, 'rival ' + i + ': wrong firing frequency/doppler');
    check(Math.abs(v.oscs[1][0].frequency.value - fo / 2) < 1, 'rival ' + i + ': half-order oscillator missing');
    check(Math.abs(v.pan.pan.value - n.pan) < 1e-3, 'rival ' + i + ': wrong stereo position');
    check(Math.abs(v.lp.frequency.value - (1200 + v10era.cutoff * 0.7) / (1 + n.dist / 100)) < 1, 'rival ' + i + ': distance filtering missing');

  check((await render('v6', { near: trio, muted: true, synthOnly: true })).peak < 1e-6, 'mute must silence the rival pack');
  check((await render('v6', { near: trio, on: false, synthOnly: true })).peak < 1e-6, 'inactive session must silence the rival pack');
  // Every voice taps the trackside send: silence the player, disconnect the rivals' DRY path and bypass

    for (const v of a.opps) (v.pan || v.g).disconnect(a.master); // drop the dry path, keep the send tap

  };
  const bus1 = await rivalSend(trio.slice(0, 1)), bus2 = await rivalSend(trio.slice(0, 2)), bus3 = await rivalSend(trio);
  const foOf = n => expected(v10era, n.rpm) * (1 + n.closing / 343);
  const powAt = (d, n) => hzPower(d, rate * 0.3, 4096, foOf(n));
  check(powAt(bus2, trio[1]) > powAt(bus1, trio[1]) * 2, 'rival 1 must feed the trackside send');
  check(powAt(bus3, trio[2]) > powAt(bus2, trio[2]) * 2, 'rival 2 must feed the trackside send');
  lines.push('PASS: rival pack — 3 voices at ' + pack.audio.opps.map(v => v.oscs[0][0].frequency.value.toFixed(0)).join('/') + ' Hz, pans ' + pack.audio.opps.map(v => v.pan.pan.value.toFixed(2)).join('/') + ', gains ' + pack.audio.opps.map(v => v.g.gain.value.toFixed(3)).join('>') + '; second rival band ' + f2Hz.toFixed(0) + ' Hz at ' + (pPair / Math.max(pSolo, 1e-12)).toFixed(0) + 'x solo power; empty/null silence, mute/pause silent, all voices on the send.');

  // Tyre squeal: four per-wheel voices. Pitch follows that wheel's slip severity and load, pan follows its
  // side, slow lockups chirp. Rendered proofs isolate the squeal paths (same pattern as sendBus/rivalSend):
  // zeroing eg kills the engine dry AND its send feed; dry renders drop the wet return, wet renders drop the
  // squeal dry paths and bypass the random IR so the output IS the raw squeal bus.
  const squealRender = async (extra, wet = false) => {
    const ctx = new OfflineAudioContext(2, rate * 0.65, rate), a = new EngineAudio();
    a.init(ctx); a.update(Object.assign(state('v6'), extra), true, null, false, wet ? 7.4 : 0);
    a.eg.gain.cancelScheduledValues(0); a.eg.gain.setValueAtTime(0, 0);
    for (const g of [a.wind, a.rumble, a.gravel, a.grass, a.hit, a.pop, a.rain, a.spray, a.tg, a.turboAir, a.bov, a.ersG]) g.disconnect(a.master);
    for (const v of a.opps) (v.pan || v.g).disconnect(a.master);
    if (wet) { for (const s of a.squeals) (s.pan || s.g).disconnect(a.master); a.send.disconnect(a.verb); a.verb.disconnect(a.verbG); a.send.connect(a.verbG); }
    else a.verbG.disconnect(a.master);

  };
  const chanEnergy = (buffer, ch) => { const d = buffer.getChannelData(ch); let e = 0; for (let i = rate * 0.2; i < rate * 0.6; i++) e += d[i] ** 2; return e; };
  const sqHz = r => dominantHz(r.buffer.getChannelData(0), rate * 0.3, 4096, 600, 1700, 2);
  const slipLo = await squealRender({ speed: 40, alpha: [0.10, 0, 0, 0] });
  const slipHi = await squealRender({ speed: 40, alpha: [0.25, 0, 0, 0] });
  const loHz = sqHz(slipLo), hiHz = sqHz(slipHi);
  check(loHz > 700 && loHz < 1100 && hiHz > 1150 && hiHz < 1600, 'squeal must sit in the physical 700–1600 Hz range: ' + loHz + '/' + hiHz);
  check(hiHz > loHz + 200, 'squeal pitch must rise with slip severity: ' + loHz + ' -> ' + hiHz);
  check(slipHi.a.squeals[0].f.frequency.value > slipLo.a.squeals[0].f.frequency.value + 200, 'bandpass centre must follow slip');
  const loadHi = await squealRender({ speed: 40, alpha: [0.25, 0, 0, 0], Fz: [6000, 1900, 2250, 2250] });
  check(loadHi.a.squeals[0].f.frequency.value > slipHi.a.squeals[0].f.frequency.value + 100, 'normal load must raise squeal pitch');

  check(lockFL.a.squeals[1].g.gain.value > 0.05 && lockFL.a.squeals.every((s, w) => w === 1 || s.g.gain.value === 0), 'only the locking wheel may squeal');

  check(slowLock.rms < lockFL.rms * 0.9, 'audibility must scale with surface speed');
  check((await squealRender({ speed: 2 })).peak < 1e-6, 'zero slip must be silent');
  check((await squealRender({ speed: 0, lock: [0, 0, 0, 1] })).peak < 1e-6, 'standstill must be silent even locked');

  // Surface & wind: kerbs knock at an audio-rate v/spacing rhythm (not a constant rumble), grass is a

  const surfaceRender = async (extra, keep, inside = false, wet = false) => {

  const crawl = await surfaceRender({ speed: 2, surf: ['kerb', 'kerb', 'asphalt', 'asphalt'] }, ['rumble']);

  check(Math.abs(crawl.a.strikeO.frequency.value - 2 / spacing) < 0.1, 'crawl strike rate must follow speed');
  const fastKerb = await surfaceRender({ speed: 90, surf: ['kerb', 'kerb', 'kerb', 'kerb'] }, ['rumble']);
  const kerbPeak = fastKerb.a.rumble.gain.value + fastKerb.a.strikeG.gain.value;

  // Grass vs gravel/sand: separate voices, spectrally distinct, no cross-triggering.

  const gravelR = await surfaceRender({ speed: 40, surf: ['gravel', 'asphalt', 'gravel', 'asphalt'] }, ['gravel']);

  check(grassR.a.grass.f.frequency.value >= 400 && grassR.a.grass.f.frequency.value <= 700, 'grass must be a low swish (400-700 Hz lowpass)');

  // V6 turbo hybrid signature sounds: spool lag from a boost state, air-rush whistle, blow-off on
  // sharp lift, ERS harmonic whine. Time evolution uses suspend/resume so update() runs at scheduled

  const isolateTurbo = (a, keep) => {
    a.eg.disconnect(a.gate); // engine dry AND its send feed, immune to later gain automation
    for (const g of [a.wind, a.rumble, a.gravel, a.grass, a.hit, a.pop, a.rain, a.spray, a.tg, a.turboAir, a.bov, a.ersG]) g.disconnect(a.master);

  };
  const winEnergy = (buffer, start, end) => {

    a.init(ctx); a.v12Loading = Promise.resolve(false); a.muted = muted;
    plan(0, sim); a.update(sim, true, null, false, 0, sim.lights || 0);
    isolateEvents(a, keep);
    const times = []; for (let t = 0.1; t < seconds - 0.04; t += 0.1) times.push(Math.round(t * 10) / 10);
    const steps = times.map(t => ctx.suspend(t));
    const rendering = ctx.startRendering();
    for (let i = 0; i < steps.length; i++) {
      await steps[i];
      plan(times[i], sim); a.update(sim, true, null, false, 0, sim.lights || 0);
      await ctx.resume();
    }
    const buffer = await rendering;
    stats(buffer, 0, seconds); // finite-sample check over the whole scenario
    return { a, buffer };
  };
  // (a) DRS: a clack on the open AND the close edge, nothing while the state holds.
  const drsPlan = (t, sim) => { sim.drsOpen = t >= 0.3 && t < 0.8; };
  const drsOut = await eventScenario(1.2, drsPlan, ['drs']);
  const drsBase = winEnergy(drsOut.buffer, 0.1, 0.25), drsOpen = winEnergy(drsOut.buffer, 0.3, 0.45), drsMid = winEnergy(drsOut.buffer, 0.55, 0.7), drsClose = winEnergy(drsOut.buffer, 0.8, 0.95), drsTail = winEnergy(drsOut.buffer, 1.0, 1.15);
  check(drsOpen > 1e-7 && drsOpen > drsBase * 4, 'DRS open must fire a clack');
  check(drsClose > 1e-7 && drsClose > drsTail * 4, 'DRS close must fire a clack');
  check(drsMid < drsOpen * 0.2 && drsBase < drsOpen * 0.2 && drsTail < drsClose * 0.2, 'DRS clack must be a short transient, not a held noise');
  const drsStill = await eventScenario(0.8, (t, sim) => { sim.drsOpen = true; }, ['drs']);
  check(stats(drsStill.buffer, 0, 0.8).peak < 1e-6, 'unchanged DRS state must stay silent');
  check(stats((await eventScenario(1.2, drsPlan, ['drs'], true)).buffer, 0, 1.2).peak < 1e-6, 'mute must silence the DRS clack');
  check((await render('v6', { on: false, sim: { drsOpen: true } })).peak < 1e-6, 'inactive session must silence DRS');
  lines.push('PASS: DRS clack — open/baseline ' + (drsOpen / Math.max(drsBase, 1e-12)).toFixed(0) + 'x, close/tail ' + (drsClose / Math.max(drsTail, 1e-12)).toFixed(0) + 'x; decays between edges, silent when unchanged/muted/paused.');

  // (b) ABS/TC: pulsing buzzes while the assists intervene — audio-rate square gates (the kerb
  // pattern), distinct rates and bands, levels well under the engine, silent otherwise.
  const buzzRender = async (extra, keep) => {
    const ctx = new OfflineAudioContext(2, rate * 0.65, rate), a = new EngineAudio();
    a.init(ctx); a.v12Loading = Promise.resolve(false);
    a.update(Object.assign(state('v6'), extra), true, null, false);
    isolateEvents(a, keep);
    const buffer = await ctx.startRendering();
    return { a, buffer, ...stats(buffer) };
  };
  const absR = await buzzRender({ absActive: true, brk: 0.9, thr: 0, rpm: 8000 }, ['absBuzz']);
  const tcR = await buzzRender({ tcActive: true }, ['tcBuzz']);
  check(absR.rms > 0.002 && tcR.rms > 0.002, 'ABS/TC buzzes must be audible while active');
  check(absR.peak < 0.1 && tcR.peak < 0.1, 'assist buzzes must stay conservative');
  const absEnv = cutEnvelope(absR.buffer, 550), tcEnv = cutEnvelope(tcR.buffer, 1500);
  const absHz = dominantHz(absEnv, cutStart, cutN, 8, 17, 0.5), tcHz = dominantHz(tcEnv, cutStart, cutN, 19, 38, 0.5);
  check(Math.abs(absHz / 12 - 1) < 0.08, 'ABS buzz must pulse at its gate rate: ' + absHz);
  check(Math.abs(tcHz / 27 - 1) < 0.08, 'TC buzz must pulse at its gate rate: ' + tcHz);
  const swing = env => { let lo = Infinity, hi = 0, mean = 0; for (let i = cutStart; i < cutStart + cutN; i++) { lo = Math.min(lo, env[i]); hi = Math.max(hi, env[i]); mean += env[i]; } return (hi - lo) / (mean / cutN); };
  check(swing(absEnv) > 0.5 && swing(tcEnv) > 0.5, 'assist buzzes must pulse, not hiss constantly');
  check(tcHz > absHz * 1.5 && absR.a.absBuzz.f.frequency.value < tcR.a.tcBuzz.f.frequency.value * 0.5, 'ABS and TC must have distinct characters');
  check(absR.a.absBuzz.gain.value + absR.a.absG.gain.value <= 0.07 + 1e-6 && tcR.a.tcBuzz.gain.value + tcR.a.tcG.gain.value <= 0.06 + 1e-6, 'assist peaks must stay well under the engine (0.38)');
  const buzzQuiet = await buzzRender({}, ['absBuzz', 'tcBuzz']);
  check(buzzQuiet.peak < 1e-6, 'no assist intervention must be silent');
  check(absR.a.tcBuzz.gain.value === 0 && tcR.a.absBuzz.gain.value === 0, 'ABS and TC must not cross-trigger');
  check((await render('v6', { muted: true, sim: { absActive: true, tcActive: true } })).peak < 1e-6, 'mute must silence assist buzzes');
  check((await render('v6', { on: false, sim: { absActive: true, tcActive: true } })).peak < 1e-6, 'inactive session must silence assist buzzes');
  lines.push('PASS: ABS/TC buzz — ABS ' + absHz.toFixed(1) + ' Hz pulse at ' + absR.a.absBuzz.f.frequency.value + ' Hz band (swing ' + swing(absEnv).toFixed(2) + '), TC ' + tcHz.toFixed(1) + ' Hz at ' + tcR.a.tcBuzz.f.frequency.value + ' Hz (swing ' + swing(tcEnv).toFixed(2) + '); RMS ' + absR.rms.toFixed(4) + '/' + tcR.rms.toFixed(4) + ', silent when inactive/muted/paused.');

  // (c) Start lights: a pip on each increment, a higher/longer go tone on 5→0, silence while held.
  const lightsPlan = (t, sim) => { sim.lights = t < 1 ? 0 : t < 6 ? Math.min(5, Math.floor(t)) : 0; };
  const lightsOut = await eventScenario(6.8, lightsPlan, ['lightG']);
  const pipE = [], preE = [];
  for (let k = 1; k <= 5; k++) { pipE.push(winEnergy(lightsOut.buffer, k, k + 0.15)); preE.push(winEnergy(lightsOut.buffer, k - 0.25, k - 0.05)); }
  for (let k = 0; k < 5; k++) check(pipE[k] > 1e-7 && pipE[k] > preE[k] * 4, 'light ' + (k + 1) + ' must pip');
  const goE = winEnergy(lightsOut.buffer, 6, 6.4);
  check(goE > pipE[4] * 2, 'lights-out go tone must be longer/louder than a pip');
  check(winEnergy(lightsOut.buffer, 1.5, 1.9) < pipE[0] * 0.1, 'no sound while the light count holds');
  const pipHz = dominantHz(lightsOut.buffer.getChannelData(0), Math.round(rate * 1.005), 4096, 700, 1500, 2);
  const goHz = dominantHz(lightsOut.buffer.getChannelData(0), Math.round(rate * 6.01), 4096, 700, 1600, 2);
  check(Math.abs(pipHz / 880 - 1) < 0.03 && Math.abs(goHz / 1318 - 1) < 0.03 && goHz > pipHz * 1.3, 'go tone must be higher than the pips: ' + pipHz + '/' + goHz);
  check(stats((await eventScenario(6.8, lightsPlan, ['lightG'], true)).buffer, 0, 6.8).peak < 1e-6, 'mute must silence the start lights');
  check((await buzzRender({}, ['lightG'])).peak < 1e-6, 'omitted lights argument must stay silent');
  lines.push('PASS: start lights — pips at ' + pipHz + ' Hz on all five increments, go tone ' + goHz + ' Hz at ' + (goE / pipE[4]).toFixed(1) + 'x pip energy on 5→0; silent while held and muted.');

  // (d) Volume: master gain = muted ? 0 : 0.5*volume, clamped; rendered RMS scales with it.
  const volFull = await render('v6'), volHalf = await render('v6', { volume: 0.5 });
  check(volFull.audio.volume === 1, 'default volume must be 1');
  check(Math.abs(volHalf.rms / volFull.rms - 0.5) < 0.1, 'volume 0.5 must render ~half RMS: ' + (volHalf.rms / volFull.rms).toFixed(3));
  check((await render('v6', { volume: 0 })).peak < 1e-6, 'volume 0 must be silent');
  check((await render('v6', { volume: 1, muted: true })).peak < 1e-6, 'mute must override volume');
  check(Math.abs(volHalf.audio.master.gain.value - 0.25) < 0.002, 'master gain must be 0.5*volume');
  check(Math.abs((await render('v6', { volume: 5 })).audio.master.gain.value - 0.5) < 0.002, 'volume must clamp to 1');
  check((await render('v6', { volume: -1 })).audio.master.gain.value === 0, 'negative volume must clamp to 0');
  lines.push('PASS: volume — RMS ratio at 0.5: ' + (volHalf.rms / volFull.rms).toFixed(3) + '; 0 silent, mute overrides, master gain 0.5*volume clamped 0..1.');

  // (e) Impact: capped thud + proportional scrape. Measured on this engine's compressor (sine
  // probe): ~+2.8 dB fixed makeup below ~0.3 peak, active ducking above it (gain 1.30 at 0.4 peak,
  // 0.96 at 0.8). The old 2.0 thud cap put crash peaks at 0.55-0.62 — into the active region on
  // every crash, pumping the mix; the 0.5 cap keeps worst-case peaks ~0.40, at the onset's edge.
  const impactScenario = async (impact, era = 'v6', thr = 1) => {
    const ctx = new OfflineAudioContext(2, rate * 1.6, rate), a = new EngineAudio(), sim = state(era);
    sim.thr = thr;
    a.init(ctx); a.v12Loading = Promise.resolve(false);
    a.update(sim, true, null, false);
    const steps = [0.4, 0.5].map(t => ctx.suspend(t));
    const rendering = ctx.startRendering();
    await steps[0]; sim.impact = impact; a.update(sim, true, null, false); await ctx.resume();
    await steps[1]; sim.impact = 0; a.update(sim, true, null, false); await ctx.resume();
    return { a, buffer: await rendering };
  };
  const impactOnly = async (impact, keep) => {
    const ctx = new OfflineAudioContext(2, rate * 0.8, rate), a = new EngineAudio(), sim = state('v6');
    a.init(ctx); a.v12Loading = Promise.resolve(false);
    a.update(sim, true, null, false);
    isolateEvents(a, keep);
    const step = ctx.suspend(0.3); // let the master fade-in settle before the crash
    const rendering = ctx.startRendering();
    await step; sim.impact = impact; a.update(sim, true, null, false); await ctx.resume();
    const buffer = await rendering;
    return { a, buffer, ...stats(buffer, 0.3, 0.75) };
  };
  // Audible metal: the isolated crash is loud, and the scrape brightens it and scales with impact.
  const crash12 = await impactOnly(12, ['hit', 'scrape']), thud12 = await impactOnly(12, ['hit']);
  check(crash12.rms > 0.01 && crash12.peak > 0.05, 'impact must stay clearly audible');
  check(crash12.brightness > thud12.brightness * 1.5, 'scrape layer must add high-frequency metal');
  const scrape12 = await impactOnly(12, ['scrape']), scrape6 = await impactOnly(6, ['scrape']);
  const scrapeE = r => winEnergy(r.buffer, 0.3, 0.55);
  check(scrapeE(scrape12) > scrapeE(scrape6) * 2.5 && scrapeE(scrape12) < scrapeE(scrape6) * 6, 'scrape level must scale with impact: ' + (scrapeE(scrape12) / scrapeE(scrape6)).toFixed(2));
  // Thud cap: identical decayed gain for impacts 12 and 30; still proportional below the cap (3 → 0.375).
  const crash30 = await impactOnly(30, ['hit']), crash3 = await impactOnly(3, ['hit']);
  check(Math.abs(crash30.a.hit.gain.value - thud12.a.hit.gain.value) < 1e-6, 'thud must cap for heavy impacts');
  check(Math.abs(crash3.a.hit.gain.value / thud12.a.hit.gain.value - 0.75) < 1e-3, 'thud must stay proportional below the cap');
  // No pump: post-impact engine firing-band power within 15% of the no-impact baseline, at full
  // throttle and at low throttle (quiet engine, crash dominates). V10's 1470 Hz firing order sits
  // well above the thud's 300 Hz lowpass, keeping the Goertzel bin clean of crash noise.
  const pumpWindows = [[0.5, 0.3], [0.7, 0.3], [1.0, 0.4]];
  const pumpRatio = (r, base, hz, s, l) => hzPower(r.buffer.getChannelData(0), rate * s, rate * l, hz) / hzPower(base.buffer.getChannelData(0), rate * s, rate * l, hz);
  const fFire = expected(v6era, 12000), f10 = expected(v10era, 12000);
  const impBase = await impactScenario(0), imp12 = await impactScenario(12), imp30 = await impactScenario(30);
  const qBase = await impactScenario(0, 'v10', 0.15), q12 = await impactScenario(12, 'v10', 0.15), q30 = await impactScenario(30, 'v10', 0.15);
  let worst = 1, worstDev = 0;
  for (const [r, base, hz] of [[imp12, impBase, fFire], [imp30, impBase, fFire], [q12, qBase, f10], [q30, qBase, f10]]) {
    for (const [s, l] of pumpWindows) {
      const ratio = pumpRatio(r, base, hz, s, l);
      check(ratio > 0.85 && ratio < 1.15, 'post-impact engine power must not pump: ' + ratio.toFixed(3) + ' at ' + s + '-' + (s + l) + ' s');
      if (Math.abs(ratio - 1) > worstDev) { worstDev = Math.abs(ratio - 1); worst = ratio; }
    }
  }
  // Crash peaks stay below the compressor's measured active region, and the crash is plainly
  // present in the full mix: at low throttle (a lift/brake crash) it lifts the window peak and energy.
  check(stats(imp30.buffer, 0.4, 0.7).peak < 0.45, 'crash peak must stay out of the compressor active region: ' + stats(imp30.buffer, 0.4, 0.7).peak.toFixed(3));
  const qPeak = stats(q12.buffer, 0.4, 0.7).peak, qBasePeak = stats(qBase.buffer, 0.4, 0.7).peak;
  check(qPeak > qBasePeak * 1.2, 'crash must be clearly audible over a quiet engine: ' + (qPeak / qBasePeak).toFixed(2) + 'x');
  check(winEnergy(q12.buffer, 0.4, 0.5) > winEnergy(qBase.buffer, 0.4, 0.5) * 1.15, 'crash must add energy to the mix');
  // Impact voices feed the trackside send; mute/pause silence them.
  const sendCtx = new OfflineAudioContext(2, rate * 0.8, rate), sendA = new EngineAudio(), sendSim = state('v6');
  sendA.init(sendCtx); sendA.update(sendSim, true, null, false, 7.4);
  isolateEvents(sendA, []);
  sendA.send.disconnect(sendA.verb); sendA.verb.disconnect(sendA.verbG); sendA.send.connect(sendA.verbG); sendA.verbG.connect(sendA.master);
  const sendStep = sendCtx.suspend(0.3);
  const sendRendering = sendCtx.startRendering();
  await sendStep; sendSim.impact = 12; sendA.update(sendSim, true, null, false, 7.4); await sendCtx.resume();
  check(stats(await sendRendering, 0.3, 0.75).rms > 0.0005, 'impact must feed the trackside send');
  check((await render('v6', { muted: true, sim: { impact: 12 } })).peak < 1e-6, 'mute must silence impacts');
  check((await render('v6', { on: false, sim: { impact: 12 } })).peak < 1e-6, 'inactive session must silence impacts');
  lines.push('PASS: impact — cap 0.5 (crash peak ' + stats(imp30.buffer, 0.4, 0.7).peak.toFixed(3) + ' < 0.45 compressor onset); worst post-impact pump ratio ' + worst.toFixed(3) + ' (bound 0.85-1.15) across full/low throttle, impacts 12/30; isolated crash RMS ' + crash12.rms.toFixed(4) + ', scrape ' + (scrapeE(scrape12) / scrapeE(scrape6)).toFixed(1) + 'x at impact 12 vs 6, brightness ' + crash12.brightness.toFixed(3) + ' vs thud ' + thud12.brightness.toFixed(3) + '; low-throttle crash peak ' + (qPeak / qBasePeak).toFixed(2) + 'x baseline, energy ' + (winEnergy(q12.buffer, 0.4, 0.5) / winEnergy(qBase.buffer, 0.4, 0.5)).toFixed(2) + 'x; send tap, mute/pause silent.');

  // Run the actual standalone menu code, stubbing only WebGL and rig hardware.
  const frame = document.getElementById('settings'), key = 'apexgp.settings.v1', saved = localStorage.getItem(key);
  try {
    const html = (await (await fetch('../docs/index.html')).text()).replace(/<script src="[^"]*"><\/script>/g, '');
    const stub = `<script src="/docs/game.js"><\/script><script>
      window.THREE = {}; window.ApexOverlay = {createTrace:() => ({}), drawInputs(){}}; window.ApexRig = {valid:() => true, RigControls:class {constructor(){this.profile={};this.hid={};} mount(){} allDevices(){return []} reconnect(){return Promise.resolve(false)}}};
      ApexGP.create = (canvas, opts) => {
        window.creationSetup = opts.setup;
        setTimeout(() => opts.onTelemetry({phase:'menu',ready:true,camera:'CHASE',fxq:0,fxAuto:false,fps:60}), 0);
        return {track:{N:4,L:4200,name:'Test circuit',turns:10,px:[0,100,100,0],pz:[0,0,100,100]},sim:{setup:opts.setup},overview(){},destroy(){},team(){},graphics(){},camera(){},pause(){},volume(v){window.volumeApplied=v;},begin(s){window.begun=s;}};
      };<\/script>`;
    const load = async settings => {
      localStorage.setItem(key, JSON.stringify(settings));
      const loaded = new Promise(resolve => { frame.onload = resolve; });
      frame.srcdoc = html.replace('<head>', '<head><base href="/docs/">').replace('<script>\n// Standalone', stub + '<script>\n// Standalone');
      await loaded;
      await new Promise(resolve => setTimeout(resolve, 50));
      return frame.contentWindow;
    };
    let win = await load({tc:false}), select = win.document.getElementById('engineEra');
    check(select.value === 'v6' && select.options.length === 4, 'old settings need modern V6 default');
    check(select.labels[0].textContent.includes('Engine sound'), 'selector needs a visible accessible label');
    const credits = win.document.querySelector('a[href="audio/credits.html"]');
    check(credits && credits.textContent.includes('Pe'), 'recording attribution link missing');
    const creditPage = await (await fetch(credits.href)).text();
    check(creditPage.includes('gpY0oKp3YC4') && creditPage.includes('creative_commons') && creditPage.includes('Edits:'), 'shipped attribution must identify source, license and edits');
    for (const era of ENGINE_ERAS) {
      select.value = era.id; select.dispatchEvent(new Event('change'));
      check(JSON.parse(localStorage.getItem(key)).engineEra === era.id, 'era not persisted');
      check(JSON.parse(localStorage.getItem(key)).tc === false, 'era must preserve other settings');
      win.document.getElementById('go').click(); check(win.begun.engineEra === era.id, 'era missing from game.begin');
    }
    win = await load(JSON.parse(localStorage.getItem(key))); select = win.document.getElementById('engineEra');
    check(select.value === 'v12' && win.creationSetup.engineEra === 'v12', 'reload or circuit creation lost era');
    const circuit = [...win.document.querySelectorAll('#sessionOpts button')].find(b => b.textContent.startsWith('Circuit'));
    circuit.click(); check(win.creationSetup.engineEra === 'v12', 'changing circuit lost era');
    frame.style.width = '350px';
    check(select.getBoundingClientRect().right <= frame.clientWidth, 'engine selector overflows narrow menu');
    win = await load({engineEra:'corrupt'});
    check(win.document.getElementById('engineEra').value === 'v6', 'corrupt saved era fallback');
    // Volume slider: native range beside Engine sound — default, persist, live apply, restore, fallback.
    let slider = win.document.getElementById('volume');
    check(slider && slider.type === 'range' && slider.min === '0' && slider.max === '100', 'volume slider must be a native 0-100 range');
    check(slider.labels[0].textContent.includes('Volume'), 'volume slider needs a visible accessible label');
    check(slider.value === '100' && win.creationSetup.volume === 1, 'settings without volume must default to 1');
    slider.value = '40'; slider.dispatchEvent(new Event('input'));
    check(JSON.parse(localStorage.getItem(key)).volume === 0.4, 'volume not persisted');
    check(JSON.parse(localStorage.getItem(key)).engineEra === 'v6', 'volume must preserve other settings');
    check(win.volumeApplied === 0.4, 'volume must apply live to a running game');
    check(win.document.getElementById('volumeVal').textContent === '40%', 'volume readout must follow the slider');
    win.document.getElementById('go').click(); check(win.begun.volume === 0.4, 'volume missing from game.begin');
    win = await load(JSON.parse(localStorage.getItem(key)));
    slider = win.document.getElementById('volume');
    check(slider.value === '40' && win.creationSetup.volume === 0.4, 'reload lost volume');
    const circuit2 = [...win.document.querySelectorAll('#sessionOpts button')].find(b => b.textContent.startsWith('Circuit'));
    circuit2.click(); check(win.creationSetup.volume === 0.4, 'changing circuit lost volume');
    for (const bad of [{ volume: 'loud' }, { volume: 5 }, { volume: -0.5 }, { volume: null }, { tc: false }]) {
      win = await load(bad);
      check(win.document.getElementById('volume').value === '100' && win.creationSetup.volume === 1, 'old/corrupt volume must fall back to default: ' + JSON.stringify(bad));
    }
    check(win.document.getElementById('volume').getBoundingClientRect().right <= frame.clientWidth, 'volume slider overflows narrow menu');
    // Leave the most useful era visible for visual inspection.
    select = win.document.getElementById('engineEra'); select.value = 'v10'; select.dispatchEvent(new Event('change'));
    frame.style.width = '100%';
    lines.push('PASS: settings labels, four choices, old/corrupt data, save/reload, begin, circuit changes and narrow layout; volume slider persists/restores/live-applies with fallback; no WebGL or hardware.');
  } finally {
    if (saved === null) localStorage.removeItem(key); else localStorage.setItem(key, saved);
  }
  document.getElementById('result').textContent = lines.join('\n');
  document.documentElement.dataset.result = 'pass';
})().catch(e => { document.getElementById('result').textContent = 'FAIL: ' + e.stack; document.documentElement.dataset.result = 'fail'; });
</script>
